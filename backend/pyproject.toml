[project]
name = "hormoneos-backend"
version = "1.0.0"
description = "HormoneOS backend powered by uv"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "psycopg2-binary==2.9.9",
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "python-multipart==0.0.9",
    "aiofiles==23.2.1",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scipy==1.13.0",
    "torch==2.3.0",
    "scikit-learn==1.4.2",
    "httpx==0.27.0",
    "openai==1.30.1",
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
